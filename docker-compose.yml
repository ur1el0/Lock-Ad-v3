services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env and pass --env-file backend/.env to Docker Compose}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env and pass --env-file backend/.env to Docker Compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-False}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-False}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost},${PUBLIC_DOMAIN:-localhost}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8003,http://127.0.0.1:8003,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175},https://${PUBLIC_DOMAIN:-localhost}"
      DJANGO_CORS_ALLOWED_ORIGINS: "${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8003,http://127.0.0.1:8003,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175},https://${PUBLIC_DOMAIN:-localhost}"
      INCIDENT_IMAGE_RETENTION_DAYS: ${INCIDENT_IMAGE_RETENTION_DAYS:-}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env and pass --env-file backend/.env to Docker Compose}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env and pass --env-file backend/.env to Docker Compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8004:8000"
    volumes:
      - incident_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/ready/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build: ./backend
    restart: always
    command: ["celery", "-A", "backend", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - ./backend/.env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-False}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-False}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost},${PUBLIC_DOMAIN:-localhost}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8003,http://127.0.0.1:8003,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175},https://${PUBLIC_DOMAIN:-localhost}"
      DJANGO_CORS_ALLOWED_ORIGINS: "${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8003,http://127.0.0.1:8003,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175},https://${PUBLIC_DOMAIN:-localhost}"
      INCIDENT_IMAGE_RETENTION_DAYS: ${INCIDENT_IMAGE_RETENTION_DAYS:-}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env and pass --env-file backend/.env to Docker Compose}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env and pass --env-file backend/.env to Docker Compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    volumes:
      - incident_media:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend inspect --timeout=5 ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build: ./backend
    restart: always
    command: ["celery", "-A", "backend", "beat", "--loglevel=info", "--schedule=/var/lib/celery/celerybeat-schedule"]
    profiles: ["production"]
    env_file:
      - ./backend/.env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-False}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-False}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost},${PUBLIC_DOMAIN:-localhost}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8003,http://127.0.0.1:8003,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175},https://${PUBLIC_DOMAIN:-localhost}"
      DJANGO_CORS_ALLOWED_ORIGINS: "${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8003,http://127.0.0.1:8003,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175},https://${PUBLIC_DOMAIN:-localhost}"
      INCIDENT_IMAGE_RETENTION_DAYS: ${INCIDENT_IMAGE_RETENTION_DAYS:-}
      GEMINI_API_KEY: ""
      OPENROUTESERVICE_API_KEY: ""
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env and pass --env-file backend/.env to Docker Compose}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env and pass --env-file backend/.env to Docker Compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    volumes:
      - celery_beat_data:/var/lib/celery
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "127.0.0.1:8003:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    profiles: ["production"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  incident_media:
  celery_beat_data:
  caddy_data:
  caddy_config:
